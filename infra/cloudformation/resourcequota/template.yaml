AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 900              # 15 minutes
    Architectures:
      - arm64

Parameters:
  CloudWatchLogGroup: 
    Type: String
    Default: /lambda/resource-quota/emf
    Description: CloudWatch Log Group for EMF
  MetricNamespace:
    Type: String
    Default: Resource Quota Utilization
    Description: Metric Namespace for various resource quota utilization metrics
  LogLevel:
    Type: String
    Default: debug
    Description: Log level for Lambda function logging
  LambdaLayerPath:
    Type: String
    Default: /opt/config/config.json
    Description: Path to Lambda layer config file
  S3BucketName:
    Type: String
    Default: resource-quota-utilization-2025
    Description: S3 Bucket name for storing the resource quota utilization manifest file
  HomeRegion:
    Type: String
    Default: us-east-1
    Description: Home AWS Region for the resource quota utilization manifest file


Resources:
  ## IAM Role for Lambda execution with necessary permissions
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Enables CloudWatch Logs: CreateLogGroup / CreateLogStream / PutLogEvents
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ResourceQuotaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # EC2
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeNatGateways
                  - ec2:DescribeVpcEndpoints
                  - ec2:DescribeSubnets
                  - ec2:DescribeTransitGatewayVpcAttachments
                  - ec2:DescribeVpcs
                  # EKS
                  - eks:ListClusters
                  # IAM
                  - iam:ListOpenIDConnectProviders
                  - iam:ListRoles
                  # Support
                  - support:RefreshTrustedAdvisorCheck
                  # ELBv2
                  - elasticloadbalancing:DescribeLoadBalancers
                  # EFS
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeMountTargets
                  # CloudWatchLogs
                  - logs:DescribeLogGroups
                  - logs:CreateLogGroup
                  - logs:DescribeLogStreams
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  # Service Quota
                  - servicequotas:GetServiceQuota
                Resource: '*'
              - Effect: Allow 
                Action: 
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: 
                  - !Sub arn:aws:s3:::${S3BucketName}/*
              - Effect: Allow 
                Action: 
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${S3BucketName}

# Lambda Layer that stores the configuration for the solution
  ConfigFileLambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: resource-quota-config
      ContentUri: ../../../lambda-layer/
      CompatibleArchitectures:
        - arm64
      CompatibleRuntimes:
        - provided.al2023

 ## Go Lambda function
  ResourceQuotaFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: geras-resource-quota
      CodeUri: ../../../cmd/resourcequota                  # assumes your SAM template lives at your repo root
      Handler: bootstrap                                # the name of your compiled binary
      Role: !GetAtt LambdaExecutionRole.Arn
      Layers : 
        - !Ref ConfigFileLambdaLayer
      Environment:
        Variables:
          LAMBDA_LAYER_PATH: !Ref LambdaLayerPath         # if you load config from a Lambda Layer
          CLOUDWATCH_LOG_GROUP: !Ref CloudWatchLogGroup
          METRIC_NAMESPACE: !Ref MetricNamespace
          LOG_LEVEL: !Ref LogLevel 
          S3_BUCKET: !Ref S3BucketName
          HOME_REGION: !Ref HomeRegion
      Events:
        EveryFiveMinutes:
          Type: Schedule
          Properties:
            Schedule: rate(5 minutes)
            Enabled: true
      
Outputs:
  ResourceQuotaFunctionArn:
    Description: "ARN of the ResourceQuota Lambda function"
    Value: !GetAtt ResourceQuotaFunction.Arn

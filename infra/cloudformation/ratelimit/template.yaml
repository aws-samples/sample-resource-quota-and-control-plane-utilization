AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
# Rate Limit Monitor - Event-driven pipeline for CloudTrail API call monitoring
Description: |
  EventBridge → SQS FIFO → 2 Go Lambdas
  • Two FIFO queues, two EB rules → dedicated message flows
  • Scheduled “flush” ping every minute via EventBridge → SQS
  • SQS EventSourceMappings with ReportBatchItemFailures

Globals:
  Function:
    Runtime: provided.al2023
    Timeout: 30
    Architectures:
      - arm64

Parameters:
  ExtensionBucket:
    Type: String
    Description: S3 bucket where emf-extension.zip is published
    Default: custom-monitoring-poc
  AssumeRoleHandler:
    Type: String
    Default: bootstrap
    Description: Go handler for the AssumeRole function
  AssumeWebIdentityHandler:
    Type: String
    Default: bootstrap
    Description: Go handler for the AssumeRoleWithWebIdentity function
  Regions:
    Type: String
    Default: us-east-1
    Description: Comma separated list of regions to run solution against
  LogLevel:
    Type: String
    Default: info
    Description: Go log‐level for Lambda functions
  CloudWatchLogGroup:
    Type: String
    Default: /lambda/ratelimit/emf
    Description: CloudWatch log‐group for EMFs
  MetricNamespace:
    Type: String
    Default: Rate Limit
    Description: CloudWatch metric namespace
  PropagateInvoker:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >-
      Set to "true" if you want IAM principal–level RPS metrics,
      "false" for overall only.
    ConstraintDescription: 'Must be "true" or "false".'

Resources:

  ####################################
  # 1) FIFO Queues (one per event)  #
  ####################################
  AssumeRoleQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: assume-role-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 30

  AssumeRoleWebIdentityQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: assume-role-web-identity-queue.fifo
      FifoQueue: true
      ContentBasedDeduplication: true
      VisibilityTimeout: 30

  #########################################################
  # 2) Scheduled flush ping rules (once per minute)       #
  #########################################################
  KeepAliveToAssumeRoleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: KeepAliveToAssumeRoleRule
      EventBusName: default
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: FlushAssumeRoleTarget
          Arn: !GetAtt AssumeRoleQueue.Arn
          RoleArn: !GetAtt EventBridgeDeliveryRole.Arn
          InputTransformer:
            InputPathsMap:
              scheduledTime: '$.time'
            InputTemplate: >-
              {"flush": true, "scheduledTime": "<scheduledTime>"}
          SqsParameters:
            MessageGroupId: "flush-group"

  KeepAliveToWebIdentityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: KeepAliveToWebIdentityRule
      EventBusName: default
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Id: FlushWebIdentityTarget
          Arn: !GetAtt AssumeRoleWebIdentityQueue.Arn
          RoleArn: !GetAtt EventBridgeDeliveryRole.Arn
          InputTransformer:
            InputPathsMap:
              scheduledTime: '$.time'
            InputTemplate: >-
              {"flush": true, "scheduledTime": "<scheduledTime>"}
          SqsParameters:
            MessageGroupId: "flush-group"

  #########################################################
  # 3) CloudTrail EventBridge rules → dedicated queues   #
  #########################################################
  AssumeRoleRule:
    Type: AWS::Events::Rule
    Properties:
      Name: AssumeRoleRule
      EventBusName: default
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AssumeRole
          awsRegion: !Split [",", !Ref Regions]
      Targets:
        - Id: ToAssumeRoleQueue
          Arn: !GetAtt AssumeRoleQueue.Arn
          InputPath: "$.detail"
          SqsParameters:
            MessageGroupId: "assume-role-group"
          RoleArn: !GetAtt EventBridgeDeliveryRole.Arn

  AssumeRoleWithWebIdentityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: AssumeRoleWithWebIdentityRule
      EventBusName: default
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventName:
            - AssumeRoleWithWebIdentity
          awsRegion: !Split [",", !Ref Regions]
      Targets:
        - Id: ToWebIdentityQueue
          Arn: !GetAtt AssumeRoleWebIdentityQueue.Arn
          InputPath: "$.detail"
          SqsParameters:
            MessageGroupId: "assume-role-web-identity-group"
          RoleArn: !GetAtt EventBridgeDeliveryRole.Arn

  ##############################################
  # 4) Allow EventBridge to send to each queue #
  ##############################################
  AssumeRoleQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AssumeRoleQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeSendToAssumeRole
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource: !GetAtt AssumeRoleQueue.Arn

  AssumeRoleWebIdentityQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AssumeRoleWebIdentityQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeSendToWebIdentity
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action:
              - sqs:SendMessage
              - sqs:SendMessageBatch
            Resource: !GetAtt AssumeRoleWebIdentityQueue.Arn

  ##################################
  # 5) IAM Role for Lambda service #
  ##################################
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole
      Policies:
        - PolicyName: DescribeLogResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"

  ################################################
  # 6) Go Lambdas wired to their respective SQS #
  ################################################
  AssumeRoleFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: AssumeRoleProcessor
      Handler: !Ref AssumeRoleHandler
      CodeUri: ../../../cmd/ratelimit
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          REGIONS:                 !Ref Regions
          LOG_LEVEL:               !Ref LogLevel
          CLOUDWATCH_LOG_GROUP:    !Ref CloudWatchLogGroup
          METRIC_NAMESPACE:        !Ref MetricNamespace
          PROPAGATE_INVOKER: !Ref PropagateInvoker
      Layers:
        - !Ref RateLimitExtensionLayer
      Events:
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt AssumeRoleQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  AssumeRoleWithWebIdentityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: go1.x
    Properties:
      FunctionName: AssumeRoleWebIdentityProcessor
      Handler: !Ref AssumeWebIdentityHandler
      CodeUri: ../../../cmd/ratelimit
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          REGIONS:                 !Ref Regions
          LOG_LEVEL:               !Ref LogLevel
          CLOUDWATCH_LOG_GROUP:    !Ref CloudWatchLogGroup
          METRIC_NAMESPACE:        !Ref MetricNamespace
          PROPAGATE_INVOKER: !Ref PropagateInvoker
      Layers:
        - !Ref RateLimitExtensionLayer
      Events:
        SQSTrigger2:
          Type: SQS
          Properties:
            Queue: !GetAtt AssumeRoleWebIdentityQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  #####################################################
  # 7) Extension Layer & EventBridge Delivery Role    #
  #####################################################
  RateLimitExtensionLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: RateLimitExtensionLayer
      Description: EMF Lambda Extension for flushing any remaining EMF's from /tmp prior to shutdown
      CompatibleRuntimes:
        - provided.al2023
      CompatibleArchitectures:
        - arm64
      Content:
        S3Bucket: !Ref ExtensionBucket     # parameter or hard-coded bucket
        S3Key:    emf/emf-extension.zip        # matches what `make upload` produces

  EventBridgeDeliveryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AllowEventBridgeSQSSend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:SendMessageBatch
                Resource:
                  - !GetAtt AssumeRoleQueue.Arn
                  - !GetAtt AssumeRoleWebIdentityQueue.Arn

  ##################
  # 8) RPS Alarms  #
  ##################
  
  # SNS Topic for alarm notifications
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: "RateLimitAlarms"
  AssumeRoleRPSAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "AssumeRole-rps-alarm"
      AlarmDescription: "AssumeRole API requests per second"
      TreatMissingData: missing
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 100
      Metrics:
        - Id: assumeRoleCount
          MetricStat:
            Metric:
              Namespace: !Ref MetricNamespace
              MetricName: CallCount
              Dimensions:
                - Name: eventName
                  Value: AssumeRole
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: assumeRoleRps
          Expression: "assumeRoleCount / 60"
          Label: "AssumeRole RPS"
          ReturnData: true

  AssumeRoleWithWebIdentityRPSAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "AssumeRoleWithWebIdentity-rps-alarm"
      AlarmDescription: "AssumeRoleWithWebIdentity API requests per second"
      TreatMissingData: missing
      EvaluationPeriods: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 100
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic
      Metrics:
        - Id: assumeWebCount
          MetricStat:
            Metric:
              Namespace: !Ref MetricNamespace
              MetricName: CallCount
              Dimensions:
                - Name: eventName
                  Value: AssumeRoleWithWebIdentity
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: assumeWebRps
          Expression: "assumeWebCount / 60"
          Label: "AssumeRoleWithWebIdentity RPS"
          ReturnData: true

  #############################
  # 8) Metric Filter for Errors #
  #############################
  AssumeRoleErrorFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: AssumeRoleFunction
    Properties:
      FilterPattern: '"ERROR"'
      LogGroupName: !Sub "/aws/lambda/${AssumeRoleFunction}"
      MetricTransformations:
        - MetricName: "Error Count"
          MetricNamespace: !Ref MetricNamespace
          MetricValue: "1"

  AssumeRoleWithWebIdentityErrorFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: AssumeRoleWithWebIdentityFunction
    Properties:
      FilterPattern: '"ERROR"'
      LogGroupName: !Sub "/aws/lambda/${AssumeRoleWithWebIdentityFunction}"
      MetricTransformations:
        - MetricName: "Error Count"
          MetricNamespace: !Ref MetricNamespace
          MetricValue: "1"

  #########################################
  # 9) Error‐Count Alarms (one per Lambda) #
  #########################################

  AssumeRoleErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "AssumeRole-Error-Alarm"
      AlarmDescription: "Alarm when the AssumeRoleProcessor Lambda emits any ERROR log"
      Namespace: !Ref MetricNamespace
      MetricName: "Error Count"
      Dimensions:
        - Name: LogGroupName
          Value: !Sub "/aws/lambda/${AssumeRoleFunction}"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  AssumeRoleWithWebIdentityErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: "AssumeRoleWithWebIdentity-Error-Alarm"
      AlarmDescription: "Alarm when the WebIdentityProcessor Lambda emits any ERROR log"
      Namespace: !Ref MetricNamespace
      MetricName: "Error Count"
      Dimensions:
        - Name: LogGroupName
          Value: !Sub "/aws/lambda/${AssumeRoleWithWebIdentityFunction}"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:

  # SQS Queues
  AssumeRoleQueueUrl:
    Description: "URL of the AssumeRole FIFO queue"
    Value: !Ref AssumeRoleQueue

  AssumeRoleQueueArn:
    Description: "ARN of the AssumeRole FIFO queue"
    Value: !GetAtt AssumeRoleQueue.Arn

  AssumeRoleWebIdentityQueueUrl:
    Description: "URL of the WebIdentity FIFO queue"
    Value: !Ref AssumeRoleWebIdentityQueue

  AssumeRoleWebIdentityQueueArn:
    Description: "ARN of the WebIdentity FIFO queue"
    Value: !GetAtt AssumeRoleWebIdentityQueue.Arn

  # EventBridge Rules
  KeepAliveToAssumeRoleRuleArn:
    Description: "ARN of the scheduled flush rule for AssumeRole"
    Value: !GetAtt KeepAliveToAssumeRoleRule.Arn

  KeepAliveToWebIdentityRuleArn:
    Description: "ARN of the scheduled flush rule for WebIdentity"
    Value: !GetAtt KeepAliveToWebIdentityRule.Arn

  AssumeRoleRuleArn:
    Description: "ARN of the CloudTrail AssumeRole EventBridge rule"
    Value: !GetAtt AssumeRoleRule.Arn

  AssumeRoleWithWebIdentityRuleArn:
    Description: "ARN of the CloudTrail WebIdentity EventBridge rule"
    Value: !GetAtt AssumeRoleWithWebIdentityRule.Arn

  # IAM Roles
  LambdaExecutionRoleArn:
    Description: "ARN of the Lambda execution role"
    Value: !GetAtt LambdaExecutionRole.Arn

  EventBridgeDeliveryRoleArn:
    Description: "ARN of the EventBridge delivery role"
    Value: !GetAtt EventBridgeDeliveryRole.Arn

  # Lambda Layer
  RateLimitExtensionLayerVersionArn:
    Description: "ARN of the EMF extension Lambda layer"
    Value: !Ref RateLimitExtensionLayer

  # Lambda Functions
  AssumeRoleFunctionArn:
    Description: "ARN of the AssumeRoleProcessor Lambda"
    Value: !GetAtt AssumeRoleFunction.Arn

  AssumeRoleWithWebIdentityFunctionArn:
    Description: "ARN of the WebIdentityProcessor Lambda"
    Value: !GetAtt AssumeRoleWithWebIdentityFunction.Arn

  AssumeRoleErrorAlarmName:
      Description: "Name of the error count alarm for AssumeRoleProcessor"
      Value: !Ref AssumeRoleErrorAlarm
  AssumeRoleWithWebIdentityErrorAlarmName:
    Description: "Name of the error count alarm for WebIdentityProcessor"
    Value: !Ref AssumeRoleWithWebIdentityErrorAlarm

